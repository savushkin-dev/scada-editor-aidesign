# Настройка статической проверки.
#
# До этого в проекте не было ни линтера, ни конфигурации, и накопилось
# 16 неиспользуемых импортов и 6 перехватов исключений, способных скрыть
# поломку. Один такой перехват уже стоил недель: svgwrite отвергал
# нестандартный атрибут, ошибка гасилась, и разметка молча теряла 54% линий.
#
# Проверка: python -m ruff check .
[tool.ruff]
line-length = 110
target-version = "py310"
# .venv* — любые окружения, включая временные под опыты (.venv-openvino):
# без звёздочки линтер уходил в чужие пакеты и выдавал 4511 замечаний
exclude = [".venv*", "runs", "output", "input", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = [
    "F",      # неиспользуемые имена и импорты, недостижимый код
    "E", "W", # оформление
    "B",      # частые ошибки: изменяемые значения по умолчанию, обход исключений
    "C4",     # лишние генераторы в списках и словарях
    "SIM",    # упрощаемые ветвления
    "RUF",    # правила самого ruff
]
# Набор UP (замена List[str] на list[str] и Optional[X] на X | None) намеренно
# выключен: он даёт 367 правок в каждом файле проекта. Пользы никакой,
# а настоящие изменения в такой истории уже не разглядеть — и откатить
# отдельную правку тоже.
ignore = [
    # Длина строки уже задана line-length; отдельное правило дублирует её
    "E501",
    # Проект написан с русскими комментариями и подписями — это намеренно
    "RUF001", "RUF002", "RUF003",
    # Лямбды в подключении сигналов Qt читаются лучше именованных функций
    "E731",
]

[tool.ruff.lint.per-file-ignores]
# Проверки намеренно правят внутренности и подменяют функции модулей
"tests/*" = ["B010", "SIM105"]

# Замер покрытия: python check_pipeline.py --coverage
#
# Нужен, чтобы «полная проверка» была числом, а не ощущением. До этого
# 1161 строка в трёх модулях не исполнялась ни проверками, ни сквозным
# прогоном, и узнать об этом можно было только вручную.
[tool.coverage.run]
# Только код проекта — пакет contur целиком. Шаблон "*.py" в include
# не годится: он совпадает и со сторонними пакетами, и в отчёт попадали
# сто тысяч строк numpy и Qt
source = ["contur"]
omit = [
    "tests/*",
    "tools/*",
    "check_pipeline.py",   # сам замеряющий
    ".venv/*",
    # PySide6 и lupa подсовывают встроенные модули так, будто они лежат
    # в папке проекта. Файлов этих на диске нет, и отчёт на них падает
    "shibokensupport/*",
    "config-3.py",
    "signature_bootstrap.py",
    "pyscript",
]

[tool.coverage.report]
# Строки, которых нет смысла требовать: точки входа и защита от импорта
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
precision = 0
skip_empty = true
